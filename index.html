<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Score Checker</title>
<style>
    body {
    font-family: Arial, sans-serif;
    max-width: 700px;
    margin: 20px auto;
    text-align: center;
    padding: 0 20px;
    position:relative;
    }

    h2 {
        font-size: 32px;
        margin-bottom: 20px;
    }

    label {
        font-size: 20px;
        margin-right: 10px;
        padding-bottom: 15px;
    }

    input[type="number"] {
        font-size: 20px;
        padding: 6px 10px;
        width: 80px;
    }

    button {
        font-size: 20px;
        padding: 12px 25px;
        margin: 15px;
        display: block;
        border: none;
        border-radius: 8px;
        background: #4a90e2;
        color: white;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #357ac9;
    }

   #grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin: 0 !important; /* ← THIS is the key */
        padding: 0;
    }
    .grid-btn {
        padding: 14px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 26px;
        font-weight: bold;
        border: 2px solid #ccc;
        background: #f7f7f7;
        transition: 0.2s;
    }

    #gridWrapper {
        display:flex;
        margin: 0 !important;
        padding: 0;
    }

    .grid-btn:hover {
        background: #e6e6e6;
    }

    #scoreRow {
        display: flex;
        justify-content: center;
        gap: 14px;
        margin: 25px 0;
    }

    .score-cell {
        width: 70px;
        height: 70px;
        border-radius: 10px;
        background: #fafafa;
        border: 2px solid #ccc;
        font-size: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: 0.2s;
    }

    .score-cell:hover {
        background: #eee;
    }

    .selected {
        background: #c8e6ff !important;
        border-color: #4aa3ff !important;
    }

    #result {
        font-size: 28px;
        margin-top: 20px;
        font-weight: bold;
    }

    #scores {
    position: relative;
    display:flex;
    flex-wrap: wrap;
    flex-direction: column;
    align-content: space-around;
    justify-content: space-between;
    align-items: center;
    }

    #naslednjiButton {
        background-color: #0e860e;
    }

    .calculatetotal {
        display: flex;
        justify-content: space-evenly;
    }

    .clicknew{
        display: flex;
        justify-content: space-evenly;
    }
</style>
</head>
<body>

<h2>SEŠTEVANJE TOČK</h2>
<div id="scores">
    <label>Število vprašanj?</label>
    <input type="number" id="scoreCount" min="1" max="50" value="5">
    <button onclick="createScoreRow()">Nastavi</button>
</div>


<div style="display:flex; gap:4px; justify-content:center; align-items:center;">
    
    <div id="gridWrapper">
        <div id="grid"></div>
    </div>

    <button 
        id="nextBtn"
        onclick="moveToNextCell()" 
        style="
            display: inline block;
            text-orientation: mixed;
            font-size: 26px;
            width: 50px;
            padding: 6px;
            background:#4a90e2;
            color:white;
            border:none;
            border-radius:10px;
            cursor:pointer;
        ">
        ➜
    </button>

</div>

<div id="scoreRow"></div>

<div class="calculatetotal">
    <button onclick="calculateTotal()">Seštej</button>
</div>

<div class="clicknew">
    <button id="naslednjiButton" onclick="clearRow()">Naslednji</button>
</div>

<div id="result"></div>

<script>
let selectedCell = null;

function createGrid() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    const keys = ["1","2","3","4","5","6","7","8","9","0","0.5","Zbriši"];

    keys.forEach(key => {
        const btn = document.createElement("div");
        btn.className = "grid-btn";
        btn.textContent = key;
        btn.onclick = () => handleKeyPress(key);
        grid.appendChild(btn);
    });

    // Wait for rendering, then sync height
    setTimeout(syncNextButtonHeight, 0);
}

// Create the row of score cells
function createScoreRow() {
    const count = parseInt(document.getElementById("scoreCount").value);
    const row = document.getElementById("scoreRow");
    row.innerHTML = "";
    selectedCell = null;

    for (let i = 0; i < count; i++) {
        const cell = document.createElement("div");
        cell.className = "score-cell";
        cell.textContent = "";
        cell.onclick = () => selectCell(cell);
        row.appendChild(cell);
    }
}

function handleKeyPress(key) {
    const row = document.getElementById("scoreRow").children;

    // Auto-select first empty cell if none selected
    if (!selectedCell) {
        for (let cell of row) {
            if (cell.textContent === "") {
                selectCell(cell);
                break;
            }
        }
    }

    if (!selectedCell) return;

    // ENTER should only move to next cell, never write text
    if (key === "Enter") {
        moveToNextCell();
        return;
    }

    if (key === "Clear") {
        selectedCell.textContent = "";
        return;
    }

    if (key === "0.5") {
        let current = selectedCell.textContent.trim();

        if (current === "") {
            selectedCell.textContent = "0.5";
            moveToNextCell();
            return;
        }

        let num = Number(current);

        if (current.endsWith(".5")) {
            selectedCell.textContent = Math.ceil(num).toString();
            moveToNextCell();
            return;
        }

        selectedCell.textContent = (num + 0.5).toString();
        moveToNextCell();
        return;
    }

    // Normal digit input
    selectedCell.textContent += key;
}

function moveToNextCell() {
    const row = document.getElementById("scoreRow").children;

    for (let i = 0; i < row.length; i++) {
        if (row[i] === selectedCell) {
            // Move to next cell if it exists
            if (i + 1 < row.length) {
                selectCell(row[i + 1]);
            } else {
                // Last cell → deselect
                selectedCell.classList.remove("selected");
                selectedCell = null;
            }
            return;
        }
    }
}

// Handle clicking a score cell
function selectCell(cell) {
    if (selectedCell) selectedCell.classList.remove("selected");
    selectedCell = cell;
    cell.classList.add("selected");
}

// Calculate total
function calculateTotal() {
    const row = document.getElementById("scoreRow").children;
    let sum = 0;

    for (let cell of row) {
        if (cell.textContent.trim() !== "") {
            sum += Number(cell.textContent);
        }
    }

    document.getElementById("result").textContent = "Skupaj: " + sum;
}

function clearRow() {
    const row = document.getElementById("scoreRow").children;

    for (let cell of row) {
        cell.textContent = "";
        cell.classList.remove("selected");
    }

    selectedCell = null;
    document.getElementById("result").textContent = "";
}

function syncNextButtonHeight() {
    const gridWrapper = document.getElementById("gridWrapper");
    const nextBtn = document.getElementById("nextBtn");

    const h = gridWrapper.offsetHeight;
    nextBtn.style.height = h + "px";
}

// Initialize grid on load
createGrid();
createScoreRow();
document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        handleKeyPress("Enter");
    }
});
</script>

</body>
</html>
